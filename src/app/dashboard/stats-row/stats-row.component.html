<div @staggerIn class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
  @for (stat of stats; track stat.key) {
    <div class="aegov-card card-bordered stat-card bg-white rounded-xl p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <!-- Icon -->
        <span class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" [class]="stat.iconBg">
          @switch (stat.icon) {
            @case ('grid') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
              </svg>
            }
            @case ('clock') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            }
            @case ('calendar') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            }
            @case ('bell') {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
            }
          }
        </span>
        <!-- Badge -->
        <span class="aegov-badge" [class]="stat.badgeClass">{{ stat.value }}</span>
      </div>
      <!-- Value -->
      <div>
        <p class="text-3xl font-heading font-bold text-secondary-900">{{ stat.value }}</p>
        <p class="text-sm font-body text-secondary-500 mt-0.5">{{ ls.t(stat.key) }}</p>
      </div>
    </div>
  }
</div>
