<section class="bg-white rounded-xl border border-whitely-200 p-5">
  <div class="flex items-center justify-between mb-5">
    <h3 class="text-h6 font-heading font-semibold text-secondary-900">{{ ls.t('recentActivity') }}</h3>
    <button class="aegov-btn btn-soft btn-sm">{{ ls.t('viewAll') }}</button>
  </div>

  <ol class="relative">
    @for (item of activities; track item.key; let last = $last) {
      <li class="flex gap-4 pb-5" [class.pb-0]="last">
        <!-- Timeline connector -->
        <div class="flex flex-col items-center shrink-0">
          <span class="w-3 h-3 rounded-full mt-1 shrink-0" [class]="item.dotColor"></span>
          @if (!last) {
            <span class="flex-1 w-px bg-whitely-200 mt-1"></span>
          }
        </div>

        <!-- Content -->
        <div class="flex-1 min-w-0 pb-1">
          <div class="flex items-start justify-between gap-2 flex-wrap">
            <p class="text-sm font-body font-medium text-secondary-800">{{ ls.t(item.key) }}</p>
            <span class="aegov-badge shrink-0" [class]="item.badgeClass">{{ ls.t(item.status) }}</span>
          </div>
          <p class="text-xs font-body text-secondary-400 mt-1">{{ relativeTime(item.date) }}</p>
        </div>
      </li>
    }
  </ol>
</section>
