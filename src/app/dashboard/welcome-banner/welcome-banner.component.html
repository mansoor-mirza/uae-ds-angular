<section class="banner-gradient rounded-2xl p-6 md:p-8 text-white relative overflow-hidden mb-6">
  <!-- Decorative circles -->
  <div class="absolute -top-8 -end-8 w-40 h-40 rounded-full bg-white/5 pointer-events-none"></div>
  <div class="absolute -bottom-12 -start-6 w-52 h-52 rounded-full bg-white/5 pointer-events-none"></div>

  <div class="relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <!-- Greeting -->
      <div class="flex items-center gap-2 mb-1">
        <span class="text-2xl">👋</span>
        <p class="text-white/80 font-body text-base">{{ ls.t('greeting') }},</p>
      </div>
      <h2 class="text-h4 font-heading font-bold text-white leading-tight mb-2">
        {{ ls.t('userName') }}
      </h2>
      <span class="aegov-badge badge-solid inline-flex items-center px-3 py-1 text-xs font-semibold rounded-full bg-white/20 text-white border border-white/30">
        {{ ls.t('userRole') }}
      </span>
    </div>

    <!-- Dates -->
    <div class="flex flex-col items-start md:items-end gap-1.5 text-sm">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-white/60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <div class="text-end">
          <span class="text-white/60 text-xs block">{{ ls.t('gregorianLabel') }}</span>
          <span class="text-white font-medium font-body text-sm">{{ gregorianDate() }}</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-white/60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"/>
        </svg>
        <div class="text-end">
          <span class="text-white/60 text-xs block">{{ ls.t('hijriLabel') }}</span>
          <span class="text-white font-medium font-body text-sm">{{ hijriDate() }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
