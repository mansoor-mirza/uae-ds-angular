<header class="sticky top-0 z-10 bg-white border-b border-whitely-200 px-6 py-3 flex items-center gap-4">
  <!-- Page title -->
  <h1 class="text-h6 font-heading font-semibold text-secondary-900 me-auto">
    {{ ls.t('dashboard') }}
  </h1>

  <!-- Search -->
  <div class="aegov-form-control control-sm hidden md:block w-64">
    <div class="form-control-input">
      <span class="control-prefix">
        <svg class="w-4 h-4 text-secondary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <input type="search" [placeholder]="ls.t('searchPlaceholder')" class="w-full">
    </div>
  </div>

  <!-- Notification bell -->
  <button class="relative p-2 rounded-lg text-secondary-500 hover:bg-whitely-100 hover:text-secondary-700 transition-colors">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    <span class="aegov-badge badge-solid badge-error absolute -top-0.5 -end-0.5 min-w-[18px] h-[18px] text-[10px] flex items-center justify-center p-0 rounded-full">
      {{ notificationCount }}
    </span>
  </button>

  <!-- User avatar -->
  <div class="flex items-center gap-2.5 ps-3 border-s border-whitely-200">
    <div class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center text-white text-xs font-bold shrink-0">
      AM
    </div>
    <div class="hidden sm:block">
      <p class="text-sm font-body font-semibold text-secondary-900 leading-tight">{{ ls.t('userName') }}</p>
      <p class="text-xs font-body text-secondary-400 leading-tight">{{ ls.t('userRole') }}</p>
    </div>
  </div>
</header>
